version: "3.8"
services:
  milvus:
    image: milvusdb/milvus:v2.4.9
    container_name: freshann-milvus
    environment:
      ETCD_USE_EMBED: "true"
      ETCD_DATA_DIR: /var/lib/milvus/etcd
      COMMON_STORAGETYPE: local
    ports:
      - "19530:19530"
      - "9091:9091"

  qdrant:
    image: qdrant/qdrant:v1.15.3
    container_name: freshann-qdrant
    ports:
      - "6333:6333"

  pgvector:
    image: pgvector/pgvector:pg16
    container_name: freshann-pgvector
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_USER: postgres
      POSTGRES_DB: vectors
    ports:
      - "5432:5432"
