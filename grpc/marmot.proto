syntax = "proto3";
package marmot.v2;

import "grpc/common/marmot_common.proto";

option go_package = "github.com/maxpert/marmot/grpc";

// Single gRPC service for all peer communication
service MarmotService {
  // ===== GOSSIP PROTOCOL =====
  // Periodic gossip messages (SWIM-style)
  rpc Gossip(GossipRequest) returns (GossipResponse);

  // Join cluster
  rpc Join(JoinRequest) returns (JoinResponse);

  // Heartbeat/health check
  rpc Ping(PingRequest) returns (PingResponse);

  // ===== REPLICATION =====
  // Replicate transaction (quorum writes)
  rpc ReplicateTransaction(TransactionRequest)
      returns (TransactionResponse);

  // Quorum read
  rpc Read(ReadRequest) returns (ReadResponse);

  // Streaming changes (for catch-up)
  rpc StreamChanges(StreamRequest)
      returns (stream ChangeEvent);

  // Get replication state (for anti-entropy)
  rpc GetReplicationState(ReplicationStateRequest)
      returns (ReplicationStateResponse);

  // ===== SNAPSHOT TRANSFER =====
  // Get snapshot metadata
  rpc GetSnapshotInfo(SnapshotInfoRequest)
      returns (SnapshotInfoResponse);

  // Stream snapshot chunks
  rpc StreamSnapshot(SnapshotRequest)
      returns (stream SnapshotChunk);

  // Get latest transaction IDs per database (for delta sync detection)
  rpc GetLatestTxnIDs(LatestTxnIDsRequest)
      returns (LatestTxnIDsResponse);

  // GetClusterNodes returns cluster membership for readonly replicas.
  // Read-only - does not modify cluster state.
  rpc GetClusterNodes(GetClusterNodesRequest) returns (GetClusterNodesResponse);

  // Forward write query from read-only replica to leader
  rpc ForwardQuery(ForwardQueryRequest) returns (ForwardQueryResponse);

  // Forward LOAD DATA LOCAL INFILE payload from read-only replica to leader.
  rpc ForwardLoadData(ForwardLoadDataRequest) returns (ForwardQueryResponse);

  // Fetch staged LOAD DATA payload chunk by chunk.
  rpc GetLoadDataChunk(LoadDataChunkRequest) returns (LoadDataChunkResponse);

  // ===== AUTO_INCREMENT CLAIMS =====
  // This node's committed AUTO_INCREMENT claim bases, which a node whose
  // claim votes are held merges from a majority before voting again.
  rpc GetAutoIncBases(AutoIncBasesRequest) returns (AutoIncBasesResponse);

  // Runs one claim base sync on this node now: it raises its bases to the
  // maximum every alive peer reports, and reports which members it reached.
  rpc SyncAutoIncBases(AutoIncSyncRequest) returns (AutoIncSyncResponse);

  // ===== LOG PULL (anti-entropy) =====
  // Lists this node's local commit log for one database strictly after a
  // position, up to its stable point, and records that position as how far
  // the requester has consumed this log.
  rpc ListCommittedLog(LogListRequest) returns (LogListResponse);

  // Streams the named committed transactions of one database, then ends.
  // Fails the call rather than send a transaction whose rows cannot be read.
  rpc FetchTransactions(FetchTransactionsRequest) returns (stream ChangeEvent);

  // Lists this node's database registry, tombstones included.
  rpc ListDatabaseRegistry(DatabaseRegistryRequest) returns (DatabaseRegistryResponse);

  // ===== CDC STREAMING =====
  // Client-streaming RPC for large CDC payloads (≥128KB)
  // Sends TransactionChunks followed by TransactionCommit
  rpc TransactionStream(stream TransactionStreamMessage) returns (TransactionResponse);
}

// ===== GOSSIP MESSAGES =====
message GossipRequest {
  uint64 source_node_id = 1;
  repeated NodeState nodes = 2;
  uint64 incarnation = 3;
}

message GossipResponse {
  repeated NodeState nodes = 1;
}

message NodeState {
  uint64 node_id = 1;
  string address = 2;
  NodeStatus status = 3;
  uint64 incarnation = 4;
  // Schema versions per database (for DDL drift detection)
  // key = database_name, value = schema_version
  map<string, uint64> database_schema_versions = 5;
  // Minimum applied sequence number (watermark for GC coordination)
  uint64 min_applied_seq = 6;
  // log_protocol_version is the node's log-pull anti-entropy protocol
  // generation: 0 means an older release (no ListCommittedLog /
  // FetchTransactions / ListDatabaseRegistry RPCs, and a per-database DDL
  // history counter that is not comparable with this protocol's), 1
  // (LogPullProtocolVersion) means it serves those RPCs. An older release
  // never sets this for itself, so it always reports 0 here.
  uint32 log_protocol_version = 7;
}

enum NodeStatus {
  ALIVE = 0;
  SUSPECT = 1;
  DEAD = 2;
  JOINING = 3;  // Node is catching up, receives gossip but not replication
  REMOVED = 4;  // Node explicitly removed from cluster via admin API
  LEAVING = 5;  // Node is gracefully shutting down or being decommissioned
}

message JoinRequest {
  uint64 node_id = 1;
  string address = 2;
}

message JoinResponse {
  bool success = 1;
  repeated NodeState cluster_nodes = 2;
}

message PingRequest {
  uint64 source_node_id = 1;
}

message PingResponse {
  uint64 node_id = 1;
  NodeStatus status = 2;
}

// ===== REPLICATION MESSAGES =====
message TransactionRequest {
  uint64 txn_id = 1;
  uint64 source_node_id = 2;
  repeated Statement statements = 3;
  HLC timestamp = 4;
  // Phase for 2PC protocol
  TransactionPhase phase = 5;
  // Consistency level
  ConsistencyLevel consistency = 6;
  // Target database name
  string database = 7;
  // Field 8 reserved (was: mutation_guards - removed in favor of IntentFilter)
  reserved 8;
  // Minimum schema version required to execute this transaction
  uint64 required_schema_version = 9;
  // COMMIT only: the commit timestamp the coordinator decided, which every
  // participant commits with. Unset from an older coordinator.
  HLC commit_timestamp = 10;
}

enum TransactionPhase {
  PREPARE = 0;  // Phase 1: Create write intents
  COMMIT = 1;   // Phase 2: Commit transaction
  ABORT = 2;    // Abort: Rollback transaction
  REPLAY = 3;   // Anti-entropy replay: Apply already-committed transaction directly
}

enum ConsistencyLevel {
  CONSISTENCY_ONE = 0;
  CONSISTENCY_QUORUM = 1;
  CONSISTENCY_ALL = 2;
}

// Statement represents either a DML row change or a DDL schema change
// Following industry standard CDC approach (MySQL binlog, TiDB TiCDC, CockroachDB)
message Statement {
  marmot.common.StatementType type = 1;
  string table_name = 2;
  string database = 3;  // Target database name (required)

  // Use oneof to clearly separate DML (row changes) from DDL (schema changes)
  oneof payload {
    RowChange row_change = 4;  // For INSERT/UPDATE/DELETE - actual row data
    DDLChange ddl_change = 5;  // For DDL - SQL statement only
    LoadDataChange load_data_change = 6; // For LOAD DATA LOCAL INFILE
    VectorIndexChange vector_index_change = 7; // For vector index control metadata
    DMLIntent dml_intent = 8; // DML decision metadata without row payload
  }

  // auto_id_claim marks this statement as a narrow AUTO_INCREMENT range claim
  // rather than ordinary DML.
  //
  // It is a FLAG on an existing StatementType, never a new StatementType, and
  // that is a rolling-upgrade requirement. A node running an older binary
  // ignores an unknown field, sees a DML statement carrying no row image, and
  // rejects it at the "DML prepare missing encoded CDC row" gate - which is a
  // clean failed transaction. A new StatementType would instead reach a
  // conversion that does not know it, and before that gate.
  //
  // The claim's payload does not travel here: it is written into the
  // transaction's intent DataSnapshot, which is what the COMMIT handler reads.
  bool auto_id_claim = 9;
  // auto_id_claim_payload carries the claim itself: {table, prevBase, newBase,
  // size}, msgpack-encoded.
  //
  // It needs a field of its own because each PARTICIPANT writes the claim into
  // its own transaction intent at PREPARE, and the COMMIT handler reads it back
  // from there - so the payload has to reach the participant. It cannot ride in
  // the oneof: RowChange would give the statement a row image and defeat the
  // rolling-upgrade gate above, DDLChange is the wrong statement type, and
  // DMLIntent carries only an intent key.
  bytes auto_id_claim_payload = 10;
  // database_generation stamps a CREATE or DROP DATABASE statement with the
  // registry generation the coordinator computed for it; with the statement
  // type it forms the key participants order database operations by.
  uint64 database_generation = 11;
}

enum VectorIndexAction {
  VECTOR_INDEX_ACTION_UNKNOWN = 0;
  VECTOR_INDEX_ACTION_CREATE = 1;
  VECTOR_INDEX_ACTION_DROP = 2;
  VECTOR_INDEX_ACTION_REINDEX = 3;
  VECTOR_INDEX_ACTION_CHECKPOINT = 4;
}

message VectorIndexChange {
  VectorIndexAction action = 1;
  string database = 2;
  string index_name = 3;
  string table_name = 4;
  string column_name = 5;
  string metric = 6;
  int32 dim = 7;
  int32 nlist = 8;
  int32 nprobe = 9;
  bool auto_tune_nlist = 10;
  bool auto_tune_nprobe = 11;
  int32 target_partition_size = 12;
  float max_norm = 13;
  uint64 source_probe_epoch = 14;
  uint64 target_probe_epoch = 15;
  uint64 cutoff_txn_id = 16;
  uint64 cutoff_seq_num = 17;
  uint32 trainer_version = 18;
  uint32 codec_version = 19;
  uint64 seed = 20;
  int64 created_at = 21;
}

// Row-level change data (DML operations)
// Follows MySQL binlog row format and TiDB TiCDC approach
message RowChange {
  // Canonical msgpack EncodedCapturedRow bytes. DML replication uses this
  // single row representation; decoded maps are local apply-time state.
  bytes encoded_row = 1;
  uint32 encoded_row_codec = 2;
}

message DMLIntent {
  bytes intent_key = 1;
}

// DDL schema change (CREATE/DROP/ALTER)
// DDL operations must ship SQL because schema changes cannot be represented as row data
message DDLChange {
  string sql = 1;  // Transpiled SQLite DDL statement
}

message LoadDataChange {
  string sql = 1;  // Original LOAD DATA LOCAL INFILE statement
  bytes data = 2;  // Optional inline payload (used for replay/streaming)
  string load_id = 3;      // Staged payload id for pull-based replication
  uint64 data_size = 4;    // Total staged payload size
  uint32 chunk_bytes = 5;  // Suggested chunk size for pull
}


message HLC {
  int64 wall_time = 1;
  int32 logical = 2;
  uint64 node_id = 3;
}

message TransactionResponse {
  bool success = 1;
  string error_message = 2;
  HLC applied_at = 3;
  // Write-write conflict detection
  bool conflict_detected = 4;
  string conflict_details = 5;
  // Rejected marks a deterministic refusal of the statement itself during
  // PREPARE (for example DDL SQLite cannot apply), as opposed to a timeout
  // or storage error. See db.PrepareResult.Rejected.
  bool rejected = 6;
  // auto_id_stored_base is the participant's own committed base for the table a
  // rejected AUTO_INCREMENT range claim named.
  //
  // The claimant retries with the maximum base any participant returned, so a
  // rejection has to carry a number. Encoding it into error_message and parsing
  // it back out would be exactly the string matching this codebase forbids.
  // Zero means "not applicable": every response that is not a claim rejection.
  uint64 auto_id_stored_base = 7;
  // error_code is the MySQL server error code the rejecting participant chose
  // for this refusal (for example 1264 ER_WARN_DATA_OUT_OF_RANGE for a
  // width-ceiling refusal). error_message carries the text; a typed error
  // cannot cross the wire, so without this field every deterministic remote
  // refusal reaches the client as 1105 HY000. Zero means "not supplied": an
  // older participant, or a failure that named no code, and the coordinator
  // then classifies the message as before.
  uint32 error_code = 8;
}

message ReadRequest {
  string query = 1;
  uint64 source_node_id = 2;
  // Snapshot timestamp for MVCC reads
  HLC snapshot_ts = 3;
  // Consistency level
  ConsistencyLevel consistency = 4;
  string table_name = 5;
  // Target database name
  string database = 6;
}

message ReadResponse {
  repeated Row rows = 1;
  HLC timestamp = 2;
}

message Row {
  map<string, bytes> columns = 1;
}

message StreamRequest {
  uint64 from_txn_id = 1;
  uint64 requesting_node_id = 2;
  string database = 3;  // Optional: filter by database, empty = all
  uint64 from_seq_num = 4;  // Optional: request by sequence number (preferred for gap detection)
}

message ChangeEvent {
  uint64 txn_id = 1;
  repeated Statement statements = 2;
  HLC timestamp = 3;
  string database = 4;  // Target database for these changes
  uint64 required_schema_version = 5;  // Minimum schema version required for this transaction
  uint64 seq_num = 6;  // Position of this transaction in the sender's local commit log
  uint64 origin_node_id = 7;  // Node that coordinated the transaction
  uint32 row_count = 8;  // Statement count recorded at commit; a receiver refuses a mismatch
}

// ===== LOG PULL MESSAGES =====
message LogListRequest {
  string database = 1;
  uint64 requesting_node_id = 2;
  uint64 after_seq = 3;     // List strictly after the position (after_seq, after_txn_id)
  uint64 after_txn_id = 4;
  uint32 limit = 5;
  uint64 consumed_seq = 6;  // Position (consumed_seq, consumed_txn_id) the requester has applied every entry through
  uint64 consumed_txn_id = 7;
  bool count_remaining = 8;  // Ask for remaining_committed in the response
}

message LogEntry {
  uint64 seq = 1;
  uint64 txn_id = 2;
  HLC commit_timestamp = 3;  // The entry's commit timestamp; unset from an older peer
}

message LogListResponse {
  repeated LogEntry entries = 1;
  uint64 stable_seq = 2;         // No entry at or below it can still become visible
  uint64 truncated_seq = 3;      // Highest position GC has deleted
  uint64 truncated_txn_id = 4;
  bool more = 5;                 // More stable entries follow the last one returned
  uint64 schema_version = 6;
  bool database_absent = 7;
  // COMMITTED entries after the last one returned (or after the request's
  // position, for an empty page), through stable_seq. Set only when the
  // request asked (count_remaining); unset from an older peer.
  optional uint64 remaining_committed = 8;
}

message FetchTransactionsRequest {
  string database = 1;
  uint64 requesting_node_id = 2;
  repeated uint64 txn_ids = 3;
}

message DatabaseRegistryRequest {
  uint64 requesting_node_id = 1;
}

message DatabaseRegistryEntry {
  string name = 1;
  uint64 generation = 2;
  bool dropped = 3;
  // legacy marks a registry row migrated from an older release's registry; a legacy
  // live row never creates the database on a peer that lacks it.
  bool legacy = 4;
}

message DatabaseRegistryResponse {
  repeated DatabaseRegistryEntry entries = 1;
}

message ReplicationStateRequest {
  uint64 requesting_node_id = 1;
  string database = 2;  // Optional: filter by specific database, empty = all
}

message ReplicationStateResponse {
  repeated DatabaseReplicationState states = 1;
}

message DatabaseReplicationState {
  string database_name = 1;
  uint64 last_applied_txn_id = 2;
  HLC last_applied_timestamp = 3;
  int64 last_sync_time = 4;
  string sync_status = 5;  // SYNCED, CATCHING_UP, FAILED
  uint64 current_max_txn_id = 6;  // Latest txn_id in this database
  int64 committed_txn_count = 7;  // Number of committed transactions (for row count comparison)
  uint64 max_seq_num = 8;  // Maximum sequence number for gap detection
}

// ===== SNAPSHOT MESSAGES =====
message SnapshotInfoRequest {
  uint64 requesting_node_id = 1;
  // Optional: describe only this database, for a StreamSnapshot naming the
  // same database; empty = every database. A per-database request is refused
  // only while that database is out of service, a whole-node request while
  // any database is. An older server ignores it and describes every database.
  string database = 2;
}

message SnapshotInfoResponse {
  uint64 snapshot_txn_id = 1;  // Keep for backward compatibility
  int64 snapshot_size_bytes = 2;
  int32 total_chunks = 3;
  HLC timestamp = 4;
  repeated DatabaseFileInfo databases = 5;
  repeated DatabaseSnapshotMetadata database_metadata = 6;  // Per-database metadata
}

message DatabaseFileInfo {
  string name = 1;        // Database name (e.g., "marmot", "__marmot_system")
  string filename = 2;    // Relative path
  int64 size_bytes = 3;
  string sha256_checksum = 4;  // SHA256 hex digest for integrity verification
}

// Per-database snapshot metadata
message DatabaseSnapshotMetadata {
  string database_name = 1;
  uint64 snapshot_txn_id = 2;      // Per-database CDC offset
  int64 size_bytes = 3;
  string sha256_checksum = 4;
  // Schema version the source node had for this database. Snapshots carry only
  // SQLite files, so without this the receiver cannot recover the version and
  // would refuse every transaction that requires a newer schema.
  uint64 schema_version = 5;
}

message SnapshotRequest {
  uint64 requesting_node_id = 1;
  string database = 2;  // Optional database filter, empty = all databases
}

message SnapshotChunk {
  int32 chunk_index = 1;
  int32 total_chunks = 2;
  bytes data = 3;
  string checksum = 4;
  string filename = 5;      // Which database file this chunk belongs to
  bool is_last_for_file = 6; // True if this is the last chunk for this file
  // Set on a file's last chunk: the SHA256 and size of the file exactly as
  // this stream sent it. A receiver verifies against these rather than the
  // checksums GetSnapshotInfo reported, which describe an earlier, separate
  // snapshot of a database that may have been written since.
  string file_sha256 = 7;
  int64 file_size_bytes = 8;
}

// ===== DELTA SYNC DETECTION =====
message LatestTxnIDsRequest {
  uint64 requesting_node_id = 1;
}

message DatabaseInfo {
  string name = 1;
  uint64 max_txn_id = 2;
  int64 size_bytes = 3;
  int64 created_at = 4;
}

message LatestTxnIDsResponse {
  map<string, uint64> database_txn_ids = 1;  // Keep for backward compatibility
  repeated DatabaseInfo database_info = 2;   // Detailed database info
}

// ===== AUTO_INCREMENT CLAIMS =====
message AutoIncBasesRequest {
  uint64 requesting_node_id = 1;
}

message AutoIncBase {
  string database = 1;
  string table = 2;
  uint64 base = 3;
}

message AutoIncBasesResponse {
  repeated AutoIncBase bases = 1;
  // The responder's own votes are held: its bases may be missing claims, so
  // a merge must not count it toward its majority.
  bool votes_held = 2;
}

message AutoIncSyncRequest {
  uint64 requesting_node_id = 1;
}

message AutoIncSyncResponse {
  uint64 node_id = 1;
  // The node's own votes are held: it has not merged claim bases yet.
  bool votes_held = 2;
  // Every member of the node's membership, itself included.
  repeated uint64 members = 3;
  // The members whose bases this sync merged, itself included.
  repeated uint64 reached = 4;
}

// ===== CLUSTER NODES =====
message GetClusterNodesRequest {}

message GetClusterNodesResponse {
  repeated NodeState nodes = 1;
}

// ===== CDC STREAMING MESSAGES =====
// Chunk of CDC data for streaming large transactions
message TransactionChunk {
  uint64 txn_id = 1;
  string database = 2;
  repeated Statement statements = 3;
  uint32 chunk_index = 4;
}

// Final commit signal for streaming
message TransactionCommit {
  uint64 txn_id = 1;
  string database = 2;
  HLC timestamp = 3;
  uint64 source_node_id = 4;
  HLC commit_timestamp = 5;  // As TransactionRequest.commit_timestamp; unset from an older coordinator
}

// Wrapper for streaming (oneof for chunk vs commit)
message TransactionStreamMessage {
  oneof payload {
    TransactionChunk chunk = 1;
    TransactionCommit commit = 2;
  }
}

// Transaction control for forwarded queries
enum ForwardTxnControl {
  FWD_TXN_NONE = 0;      // Regular statement (auto-commit or part of txn)
  FWD_TXN_BEGIN = 1;     // Start new transaction
  FWD_TXN_COMMIT = 2;    // Commit current transaction
  FWD_TXN_ROLLBACK = 3;  // Rollback current transaction
}

message ForwardQueryRequest {
  uint64 replica_node_id = 1;    // Which replica is forwarding
  uint64 session_id = 2;         // Client session ID on replica
  uint64 request_id = 9;         // Monotonic per-session request ID for idempotency
  string database = 3;           // Target database
  string sql = 4;                // SQL statement (transpiled)
  ForwardTxnControl txn_control = 5;
  bool wait_for_replication = 6; // Block until replicated back
  repeated bytes params = 7;     // Prepared statement params (msgpack encoded)
  uint32 timeout_ms = 8;         // Client-specified timeout in milliseconds
}

message ForwardQueryResponse {
  bool success = 1;
  string error_message = 2;
  int64 rows_affected = 3;
  int64 last_insert_id = 4;
  uint64 committed_txn_id = 5;   // For read-your-writes
  bool in_transaction = 6;       // True if session has active transaction on leader
  // MySQL server error code for a failed query, so a replica can reproduce the
  // leader's ERR packet instead of flattening every failure to ER_UNKNOWN_ERROR.
  // 0 means "not supplied": an older leader, or a rejection raised before the
  // statement reached the coordinator. A replica reports 1105 for 0.
  uint32 error_code = 7;
  // SQLSTATE for the same failure. It is sent rather than derived from the code
  // because the mapping is not injective: the leader pairs code 1105 with both
  // HY000 and 23000 (an unclassified error vs an unclassified CONSTRAINT
  // failure), so a replica rebuilding it from the number alone would have to
  // guess. Empty means "not supplied", same as error_code 0.
  string sql_state = 8;
}

message ForwardLoadDataRequest {
  uint64 replica_node_id = 1;
  uint64 session_id = 2;
  uint64 request_id = 3;
  string database = 4;
  string sql = 5;
  bytes data = 6;
  bool wait_for_replication = 7;
  uint32 timeout_ms = 8;
}

message LoadDataChunkRequest {
  uint64 requesting_node_id = 1;
  string load_id = 2;
  uint64 offset = 3;
  uint32 max_bytes = 4;
}

message LoadDataChunkResponse {
  bytes data = 1;
  uint64 total_size = 2;
}
